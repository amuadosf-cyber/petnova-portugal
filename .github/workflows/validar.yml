name: Validar PetNova
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Catálogo, publicações simuladas e bloqueio de compras
        run: |
          python scripts/sincronizar_catalogo.py --check
          python -m unittest discover -s tests -v
          node --check assets/store.js
          node --check assets/studio.js
