name: Criar 2 conteudos diarios (demonstracao)
on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
    inputs:
      usar_ia:
        description: 'Assistir os títulos com Qwen3 local no runner (sem API paga)'
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - 'automacao_conteudos.py'
      - 'petnova/**'
      - 'produtos.csv'
      - 'config/**'
      - 'requirements.txt'
      - '.github/workflows/conteudos.yml'
      - 'scripts/preparar_galeria.py'
      - 'scripts/publicar_galeria.py'
permissions:
  contents: read
concurrency:
  group: petnova-conteudos-${{ github.ref }}
  cancel-in-progress: false
jobs:
  criar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Preparar FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg fonts-dejavu-core
          fi
      - name: Preparar IA local gratuita no runner
        id: ia
        if: ${{ vars.PETNOVA_IA_ENABLED != 'false' && (github.event_name != 'workflow_dispatch' || inputs.usar_ia) }}
        continue-on-error: true
        timeout-minutes: 6
        run: |
          mkdir -p "$RUNNER_TEMP/petnova-ollama"
          curl --fail --location --max-time 180 https://ollama.com/download/ollama-linux-amd64.tar.zst --output "$RUNNER_TEMP/petnova-ollama/package.tar.zst"
          tar --zstd -xf "$RUNNER_TEMP/petnova-ollama/package.tar.zst" -C "$RUNNER_TEMP/petnova-ollama"
          "$RUNNER_TEMP/petnova-ollama/bin/ollama" serve > "$RUNNER_TEMP/petnova-ollama/serve.log" 2>&1 &
          python scripts/esperar_ollama.py
          timeout 180 "$RUNNER_TEMP/petnova-ollama/bin/ollama" pull qwen3:0.6b
      - name: Gerar dois anuncios e videos verticais
        env:
          PETNOVA_AI_READY: ${{ steps.ia.outcome }}
        run: |
          if [ "$PETNOVA_AI_READY" = 'success' ]; then
            python automacao_conteudos.py --ia ollama --modelo qwen3:0.6b
          else
            python automacao_conteudos.py
          fi
      - name: Verificar MP4 e simular as tres redes (sem credenciais)
        run: |
          python scripts/validar_media.py
          python scripts/simular_tudo.py
      - name: Guardar conteudos para descarregar no GitHub Actions
        uses: actions/upload-artifact@v7.0.2
        with:
          name: petnova-conteudos-${{ github.run_id }}
          path: conteudos/
          if-no-files-found: error
          retention-days: 7
      - name: Resumo
        run: python scripts/resumo_execucao.py

  galeria:
    name: Atualizar galeria para telemovel
    needs: criar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8.0.2
        with:
          name: petnova-conteudos-${{ github.run_id }}
          path: conteudos/
      - name: Exportar apenas os ficheiros demonstrativos
        run: python scripts/preparar_galeria.py
      - name: Disponibilizar rascunhos na galeria publica
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publicar_galeria.py
